syntax = "proto3";
package arena.lobby;
import "envelope.proto";

// Gateway supplies physical identity; public client payloads cannot override it.
message ExecuteRequest {
  string gateway_instance = 1;
  uint64 connection_id = 2;
  arena.protocol.Envelope message = 3;
  uint64 player_id = 4;
  uint64 session_epoch = 5;
}
message SessionProjection {
  uint64 player_id = 1;
  uint64 epoch = 2;
  int64 expires_at_unix = 3;
  uint64 session_id = 4;
}
message ExecuteReply {
  arena.protocol.Envelope message = 1;
  SessionProjection session = 2;
  uint64 committed_revision = 3;
}
message DetachRequest {
  string gateway_instance = 1;
  uint64 connection_id = 2;
  uint64 player_id = 3;
  uint64 session_epoch = 4;
}
message DetachReply { uint64 committed_revision = 1; }
message HeartbeatRequest {
  string gateway_instance = 1;
  repeated uint64 connection_ids = 2;
}
message HeartbeatReply {
  repeated uint64 revoked_connection_ids = 1;
  uint64 committed_revision = 2;
}

// Operations-only control: start acknowledges durable Prepare; status observes WAL facts.
message MigrationRequest {
  uint32 version = 1;
  uint64 room_id = 2;
  uint64 incarnation = 3;
  uint64 owner_epoch = 4;
  uint64 migration_id = 5;
  string target_node = 6;
}
message MigrationStatusRequest {
  uint32 version = 1;
  uint64 room_id = 2;
  uint64 incarnation = 3;
  uint64 migration_id = 4;
}
message MigrationReply {
  enum Phase { NONE = 0; PREPARING = 1; FREEZING = 2; FROZEN = 3; TRANSFERRED = 4; COMMITTED = 5; ABORTED = 6; }
  uint32 version = 1;
  uint64 room_id = 2;
  uint64 incarnation = 3;
  uint64 migration_id = 4;
  string owner = 5;
  uint64 owner_epoch = 6;
  Phase phase = 7;
  string source = 8;
  string target = 9;
  uint64 source_epoch = 10;
  uint64 target_epoch = 11;
  uint64 cutoff = 12;
  sint64 deadline_nanos = 13;
  uint64 physical_tick = 14;
  uint64 logical_tick = 15;
  uint64 checksum = 16;
  uint64 cursor = 17;
  uint64 committed_revision = 18;
}
