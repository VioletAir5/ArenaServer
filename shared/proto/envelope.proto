syntax = "proto3";

// Application messages carried inside the length-prefixed packet
// frame.

package arena.protocol;

// Stable payload schema inside the existing length-prefixed
// PacketCodec frame. Never renumber a field or reuse a retired tag.
// Tag 2 was legacy_client_tag in the frozen v1 compatibility fixture.
enum MsgId {
  MSG_UNSPECIFIED = 0;
  MSG_LOGIN_REQUEST = 10;
  MSG_LOGIN_RESPONSE = 11;
  MSG_PING = 12;
  MSG_PONG = 13;
  MSG_ERROR = 14;
  MSG_SESSION_STATE_REQUEST = 20;
  MSG_SESSION_STATE_RESPONSE = 21;
  MSG_ROOM_JOIN_REQUEST = 30;
  MSG_ROOM_JOIN_RESPONSE = 31;
  MSG_ROOM_LEAVE_REQUEST = 32;
  MSG_ROOM_LEAVE_RESPONSE = 33;
  MSG_MATCH_JOIN_REQUEST = 40;
  MSG_MATCH_JOIN_RESPONSE = 41;
  MSG_MATCH_CANCEL_REQUEST = 42;
  MSG_MATCH_CANCEL_RESPONSE = 43;
  MSG_MATCH_STATUS_REQUEST = 44;
  MSG_MATCH_STATUS_RESPONSE = 45;
  MSG_ROOM_INPUT_REQUEST = 50;
  MSG_ROOM_INPUT_RESPONSE = 51;
  MSG_ROOM_SNAPSHOT_REQUEST = 52;
  MSG_ROOM_SNAPSHOT_RESPONSE = 53;
}

// Stable wire codes. Error.code stays uint32 for v1 descriptor
// compatibility.
enum ErrorCode {
  ERR_OK = 0;
  ERR_UNKNOWN_MESSAGE = 1001;
  ERR_INVALID_REQUEST = 1002;
  ERR_UNAUTHENTICATED = 1003;
  ERR_TIMEOUT = 1004;
  ERR_TOO_MANY_REQUESTS = 1005;
  ERR_DUPLICATE_REQUEST = 1006;
  ERR_BUSINESS_FAILURE = 2001;
  ERR_UNAVAILABLE = 2002;
  ERR_INTERNAL = 9000;
}

message Envelope {
  uint64 request_id = 1;
  reserved 2;
  reserved "legacy_client_tag";
  uint64 sent_at_unix_ms = 3;
  // Zero means a v1 peer: infer from the known payload. Never reuse
  // this tag.
  uint32 msg_id = 4;

  oneof payload {
    LoginRequest login_request = 10;
    LoginResponse login_response = 11;
    Ping ping = 12;
    Pong pong = 13;
    Error error = 14;
    SessionStateRequest session_state_request = 20;
    SessionStateResponse session_state_response = 21;
    RoomJoinRequest room_join_request = 30;
    RoomJoinResponse room_join_response = 31;
    RoomLeaveRequest room_leave_request = 32;
    RoomLeaveResponse room_leave_response = 33;
    MatchJoinRequest match_join_request = 40;
    MatchJoinResponse match_join_response = 41;
    MatchCancelRequest match_cancel_request = 42;
    MatchCancelResponse match_cancel_response = 43;
    MatchStatusRequest match_status_request = 44;
    MatchStatusResponse match_status_response = 45;
    RoomInputRequest room_input_request = 50;
    RoomInputResponse room_input_response = 51;
    RoomSnapshotRequest room_snapshot_request = 52;
    RoomSnapshotResponse room_snapshot_response = 53;
  }
}

// Explicit credential mode; zero preserves the old password request.
enum CredentialKind {
  CREDENTIAL_PASSWORD = 0;
  CREDENTIAL_JWT = 1;
}

message LoginRequest {
  string account = 1;
  bytes credential = 2;
  string client_version = 3;
  CredentialKind credential_kind = 4;
}

message LoginResponse {
  bool accepted = 1;
  string session_token = 2;
  Error error = 3;
  uint64 player_id = 4;
  uint64 session_epoch = 5;
  // Logical identity survives authorized transport recovery.
  uint64 session_id = 6;
  // Zero means the session currently belongs to no room.
  uint64 room_id = 7;
  bool resumed = 8;
}

enum Presence {
  PRESENCE_UNSPECIFIED = 0;
  PRESENCE_ONLINE = 1;
  PRESENCE_DETACHED = 2;
}

// State is returned only to the authenticated current session.
message SessionStateRequest {}

message RoomMember {
  uint64 player_id = 1;
  uint64 session_id = 2;
  Presence presence = 3;
}

message SessionStateResponse {
  uint64 session_id = 1;
  uint64 player_id = 2;
  uint64 room_id = 3;
  Presence presence = 4;
  repeated RoomMember members = 5;
}

// A nonzero ID creates a bounded gateway roster if it does not exist.
// This roster does not represent the planned battle RoomActor.
message RoomJoinRequest {
  uint64 room_id = 1;
}
message RoomJoinResponse {
  SessionStateResponse state = 1;
}
message RoomLeaveRequest {}
message RoomLeaveResponse {
  SessionStateResponse state = 1;
}

enum MatchTicketState {
  MATCH_TICKET_UNSPECIFIED = 0;
  MATCH_TICKET_QUEUED = 1;
  MATCH_TICKET_RESERVED = 2;
  MATCH_TICKET_ASSIGNED = 3;
  MATCH_TICKET_CANCELLED = 4;
  MATCH_TICKET_EXPIRED = 5;
  MATCH_TICKET_FAILED = 6;
}

// Server-owned ticket state. A detached session remains queued but is
// not eligible for pairing until authorized recovery. No room is
// allocated here.
message MatchTicket {
  uint64 player_id = 1;
  uint64 ticket_id = 2;
  uint64 join_key = 3;
  MatchTicketState state = 4;
  uint32 mmr = 5;
  uint32 window = 6;
  uint64 waited_ms = 7;
  uint64 remaining_ms = 8;
  uint64 match_id = 9;
  uint64 opponent_player_id = 10;
  uint64 opponent_ticket_id = 11;
  bool active = 12;
}

// Retry the same nonzero key after an uncertain RPC outcome. Ratings
// and player/session identities are established by the server, never
// the client.
message MatchJoinRequest {
  uint64 join_key = 1;
}
message MatchJoinResponse {
  MatchTicket state = 1;
}
message MatchCancelRequest {
  uint64 ticket_id = 1;
}
message MatchCancelResponse {
  MatchTicket state = 1;
}
message MatchStatusRequest {
  uint64 ticket_id = 1;
}
message MatchStatusResponse {
  MatchTicket state = 1;
}

enum RoomInputStatus {
  ROOM_INPUT_UNSPECIFIED = 0;
  ROOM_INPUT_APPLIED = 1;
  ROOM_INPUT_DUPLICATE = 2;
  ROOM_INPUT_GAP = 3;
  ROOM_INPUT_STALE = 4;
  ROOM_INPUT_CONFLICT = 5;
  ROOM_INPUT_NOT_MEMBER = 6;
  ROOM_INPUT_INVALID = 7;
}

// Canonical player state from the last committed room tick.
message RoomPlayerState {
  uint64 player_id = 1;
  uint64 session_id = 2;
  uint64 member_epoch = 3;
  sint32 x = 4;
  sint32 y = 5;
  uint64 last_seq = 6;
  sint32 last_dx = 7;
  sint32 last_dy = 8;
}

message RoomSnapshot {
  uint64 room_id = 1;
  uint64 incarnation = 2;
  uint64 tick = 3;
  fixed64 checksum = 4;
  repeated RoomPlayerState players = 5;
  uint64 checksum_version = 6;
  sint32 position_limit = 7;
}

// Identity and room come from the current authenticated binding. Controls are
// integer steps in [-1, 1]; sequence starts at one per membership generation.
message RoomInputRequest {
  uint64 actor_incarnation = 1;
  uint64 membership_epoch = 2;
  uint64 seq = 3;
  sint32 dx = 4;
  sint32 dy = 5;
}
// Completed after the input tick, including a typed rejected-input outcome.
message RoomInputResponse {
  RoomSnapshot state = 1;
  RoomInputStatus result = 2;
}
// Initializes an actor lazily for an already joined authoritative roster.
message RoomSnapshotRequest {}
message RoomSnapshotResponse {
  RoomSnapshot state = 1;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

message Error {
  uint32 code = 1;
  string message = 2;
  repeated Error causes = 3;
}
